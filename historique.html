<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historique des mouvements - La Lunetterie</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="mobile-shell.css" />
    <link rel="stylesheet" href="admin-mobile.css" />
    <link rel="stylesheet" href="historique.css" />
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="ic-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3.5 2"/></symbol>
        <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
        <symbol id="ic-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
        <symbol id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
        <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
        <symbol id="ic-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
        <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
        <symbol id="ic-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
        <symbol id="ic-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="ic-radar" viewBox="0 0 24 24"><path d="M12 12 20 7"/><path d="M12 12a5 5 0 1 0 5 5"/><path d="M12 12a9 9 0 1 0 9 9"/><circle cx="12" cy="12" r="1"/></symbol>
        <symbol id="ic-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v7a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-7z"/></symbol>
        <symbol id="ic-box" viewBox="0 0 24 24"><path d="m21 8-9-5-9 5 9 5 9-5Z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
        <symbol id="ic-send" viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></symbol>
        <symbol id="ic-store" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M9 20v-6h6v6"/></symbol>
        <symbol id="ic-bookmark" viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></symbol>
        <symbol id="ic-flask" viewBox="0 0 24 24"><path d="M9 2h6M10 2v6.4a2 2 0 0 1-.4 1.2L4.7 17a2 2 0 0 0 1.6 3.2h11.4a2 2 0 0 0 1.6-3.2l-4.9-7.4a2 2 0 0 1-.4-1.2V2"/></symbol>
        <symbol id="ic-check-circle" viewBox="0 0 24 24"><path d="M22 11.1V12a10 10 0 1 1-6-9.2"/><path d="m9 11 3 3L22 4"/></symbol>
        <symbol id="ic-corner-up-left" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></symbol>
        <symbol id="ic-clipboard" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/></symbol>
        <symbol id="ic-alert-triangle" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
        <symbol id="ic-glasses" viewBox="0 0 24 24"><circle cx="6.5" cy="12.5" r="4"/><circle cx="17.5" cy="12.5" r="4"/><path d="M10.5 12.5h3M2.4 10.8l2.1-1M21.6 10.8l-2.1-1"/></symbol>
        <symbol id="ic-warehouse" viewBox="0 0 24 24"><path d="M3 10.2L12 4l9 6.2V20a1 1 0 0 1-1 1h-4v-7H8v7H4a1 1 0 0 1-1-1v-9.8z"/></symbol>
        <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></symbol>
        <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
        <symbol id="ic-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
        <symbol id="ic-maximize" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></symbol>
    </defs></svg>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h2><svg class="i" style="vertical-align:-3px;margin-right:6px;"><use href="#ic-history"/></svg>Historique des mouvements</h2>
                <p>Traçabilité complète des montures : réceptions, transferts, présentoir, ventes, réserves...</p>
            </div>
            <div class="topbar-actions">
                <div class="search-box" id="quickTrackBox">
                    <svg class="i"><use href="#ic-search"/></svg>
                    <input type="text" id="quickTrackInput" placeholder="Suivre un code-barres..." />
                </div>
                <button class="action-btn" id="themeToggle" title="Changer de thème">
                    <svg class="i" id="themeIcon"><use href="#ic-sun"/></svg>
                </button>
                <button class="btn btn-ghost" type="button" onclick="window.location.href='admin.html'">
                    <svg class="i"><use href="#ic-arrow-left"/></svg><span>Retour</span>
                </button>
                <button class="btn btn-primary" id="refreshBtn" type="button">
                    <svg class="i"><use href="#ic-refresh"/></svg><span>Actualiser</span>
                </button>
            </div>
        </header>

        <div class="page-content">
            <!-- ============================
            VUE 1 : ÉTAPES DU PARCOURS
            ============================ -->
            <div id="stageOverview">
                <div class="date-block-grid stage-grid" id="stageGrid">
                    <div class="track-loading"><span class="spinner"></span> Chargement du parcours…</div>
                </div>
            </div>

            <!-- ============================
            VUE 2 : DÉTAIL D'UNE ÉTAPE (blocs de période + activités)
            ============================ -->
            <div id="stageDetail" style="display:none;">
                <div class="table-toolbar" style="border:1px solid var(--line);border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface);">
                    <button class="btn btn-ghost" type="button" id="stageBackBtn">
                        <svg class="i"><use href="#ic-arrow-left"/></svg><span id="stageBackLabel">Toutes les étapes</span>
                    </button>
                    <span class="date-detail-label" id="stageDetailTitle"></span>
                </div>
                <div class="date-block-grid period-grid" id="periodGrid"></div>
                <div class="stage-activity">
                    <h3 class="activity-heading"><svg class="i"><use href="#ic-history"/></svg>Activités récentes</h3>
                    <div id="stageActivityList" class="activity-list"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- ============================
    PANNEAU DE SUIVI D'UNE MONTURE (temps réel)
    ============================ -->
    <div class="track-backdrop" id="trackBackdrop">
        <aside class="track-panel" id="trackPanel" role="dialog" aria-modal="true" aria-labelledby="trackTitle">
            <header class="track-head">
                <button class="track-photo" id="trackPhotoBtn" type="button" title="Voir la photo en grand">
                    <img id="trackPhotoImg" alt="Photo de la monture" hidden />
                    <span class="track-photo-fallback" id="trackPhotoFallback"><svg class="i"><use href="#ic-glasses"/></svg></span>
                    <span class="track-photo-zoom"><svg class="i"><use href="#ic-maximize"/></svg></span>
                </button>
                <div class="track-head-info">
                    <span class="track-eyebrow"><svg class="i"><use href="#ic-radar"/></svg> Suivi en direct</span>
                    <h2 id="trackTitle">—</h2>
                    <p id="trackSubtitle">—</p>
                </div>
                <button class="close-btn" id="closeTrackPanel" type="button" aria-label="Fermer le suivi"><svg class="i"><use href="#ic-close"/></svg></button>
            </header>
            <div class="track-status" id="trackStatus">
                <span class="live-dot" aria-hidden="true"></span>
                <span id="trackStatusText">Connexion au suivi…</span>
            </div>
            <div class="track-body" id="trackBody">
                <div class="track-loading"><span class="spinner"></span> Chargement de la trajectoire…</div>
            </div>
        </aside>
    </div>

    <!-- ============================
    VISIONNEUSE PHOTO (plein écran)
    ============================ -->
    <div class="lightbox-backdrop" id="lightboxBackdrop">
        <button class="close-btn lightbox-close" id="closeLightbox" type="button" aria-label="Fermer la photo"><svg class="i"><use href="#ic-close"/></svg></button>
        <img id="lightboxImg" alt="Photo de la monture en grand" />
        <p class="lightbox-caption" id="lightboxCaption"></p>
    </div>

    <script src="ui-slider.js"></script>
    <script src="historique.js"></script>
</body>
</html>
