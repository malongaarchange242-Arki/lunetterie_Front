<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecteur mobile</title>
<style>body{margin:0;background:#101116;color:#f7f7fa;font:16px system-ui;padding:24px}main{max-width:460px;margin:auto}.card{background:#1c1e27;border:1px solid #353846;border-radius:18px;padding:20px;margin:14px 0}button,input{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;font:inherit;margin-top:10px}button{border:0;background:#ef168e;color:white;font-weight:700}input{border:1px solid #4a4d5a;background:#11131a;color:white}video{width:100%;border-radius:12px;background:#000}small{color:#b6bac8}.ok{color:#54d69a}.err{color:#ff7a92}</style>
<body><main><h1>Lecteur mobile</h1><p id="state">Connexion au poste…</p><section class="card"><b>Code-barres</b><video id="video" playsinline muted></video><input id="barcode" placeholder="Saisir le code si besoin"><button id="send">Envoyer le code</button></section><section class="card"><b>Photo de la monture</b><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"><button id="upload">Envoyer la photo</button><small>La photo apparaît immédiatement sur le poste PC.</small></section></main>
<script>
const hashParams=new URLSearchParams(location.hash.slice(1)), queryParams=new URLSearchParams(location.search);
const id=hashParams.get('session')||queryParams.get('session'), token=hashParams.get('token')||queryParams.get('token');
const base='https://api-lunetterie.universearch.com/api/v1/inventory/mobile-capture/sessions/'+encodeURIComponent(id), state=document.querySelector('#state');
const set=(t,k='')=>{state.textContent=t;state.className=k};
async function call(path,opts={}){const r=await fetch(base+path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(token),opts);const j=await r.json().catch(()=>({}));if(!r.ok||j.success===false)throw Error(j.error||'Connexion impossible');return j}
const controls=document.querySelectorAll('#send,#upload,#barcode,#photo');
if(!id||!token){set('Lien d’appairage invalide : ouvrez le QR généré depuis le poste PC.','err');controls.forEach(control=>control.disabled=true)}
else call('/connect',{method:'POST'}).then(()=>set('Connecté au poste PC','ok')).catch(e=>set('Connexion impossible : '+e.message,'err'));
document.querySelector('#send').onclick=async()=>{if(!id||!token)return;const input=document.querySelector('#barcode'),barcode=input.value.trim();if(!barcode)return;try{await call('/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({barcode})});input.value='';set('Code envoyé au PC','ok')}catch(e){set('Envoi impossible : '+e.message,'err')}};
document.querySelector('#upload').onclick=async()=>{if(!id||!token)return;const file=document.querySelector('#photo').files[0];if(!file){set('Choisissez une photo','err');return}const fd=new FormData;fd.append('image',file);try{await call('/photo',{method:'POST',body:fd});set('Photo envoyée au PC','ok')}catch(e){set('Envoi impossible : '+e.message,'err')}};
(async()=>{if(!id||!token||!('BarcodeDetector'in window)||!navigator.mediaDevices)return;try{const detector=new BarcodeDetector({formats:['code_128','code_39','ean_13','ean_8','qr_code']});const video=document.querySelector('#video');video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});await video.play();let busy=false;setInterval(async()=>{if(busy||video.readyState<2)return;try{const codes=await detector.detect(video);if(codes[0]){busy=true;document.querySelector('#barcode').value=codes[0].rawValue;document.querySelector('#send').click();setTimeout(()=>busy=false,1200)}}catch(_){}},350)}catch(e){set('Caméra indisponible : saisissez le code manuellement.','err')}})();
</script></body></html>
